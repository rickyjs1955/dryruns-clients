name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets. Placeholders keep the proxy
          # route compilable; no estimate calls are made at build time.
          BUDGETARY_API_BASE: https://api.budgetary.tools
          BUDGETARY_API_KEY: ci-placeholder
