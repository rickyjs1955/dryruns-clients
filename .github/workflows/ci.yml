name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets. Placeholders keep the proxy
          # route compilable; no estimate calls are made at build time.
          BUDGETARY_API_BASE: https://api.budgetary.tools
          BUDGETARY_API_KEY: ci-placeholder

      - name: Verify the API key is not bundled
        run: |
          # The build-time BUDGETARY_API_KEY (ci-placeholder) is read only at
          # runtime in the server route, so it must never appear in the build
          # output. If it does, a secret was inlined (e.g. via a NEXT_PUBLIC_
          # prefix or string interpolation) — fail the build.
          if grep -rl "ci-placeholder" .next 2>/dev/null; then
            echo "::error::BUDGETARY_API_KEY value leaked into the build output (.next)"
            exit 1
          fi
          echo "OK: API key value absent from .next output"
